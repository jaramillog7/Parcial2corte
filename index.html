<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disney</title>
    <link rel="stylesheet" href="css/styles.css">

</head>


<body>

    <nav class="navbar">

        <div class="navbar__logo">
            <img src="images/logo.png" alt="Logo de Disney">
        </div>

        <div class="navbar__links">
            <a href="#">DISNEY +</a>
            <a href="#">PARKS & TRAVEL</a>
            <a href="#">MOVIES</a>
            <a href="#">SHOP</a>
            <a href="#">MORE</a>
        </div>

        <div class="navbar__right">
            <a href="#">LOG IN</a>

            <form class="navbar__search" role="search">
                <input type="search" placeholder="Search" aria-label="Search">
                <button type="submit" aria-label="Search">
                    &#128269;
                </button>
            </form>
        </div>
    
    </nav>


    <section class="banner">

            <div class="banner__contenido">

                <img
                    class="banner__logo"
                    src="images/snow-white.png"
                    alt="Snow White"
                >

                <p class="banner__descripcion">
                    Experience Snow White, now playing only in theaters!
                </p>

                <div class="banner__botones">
                    <a href="#" class="banner__boton banner__boton--principal">
                        Get Tickets Now
                    </a>

                <a href="#" class="banner__boton banner__boton--secundario">
                    Learn More
                </a>
        </div>

    </div>

    </section>

    <main>
        
    </main>

    
</body>
</html>
